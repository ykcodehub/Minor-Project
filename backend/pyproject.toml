[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veriora-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23,<26", "cryptography>=44", "python-multipart>=0.0.20",
  "boto3>=1.36,<2", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "pymupdf>=1.25,<2", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5", "tiktoken>=0.9,<1", "email-validator>=2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11"]
mcp = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
